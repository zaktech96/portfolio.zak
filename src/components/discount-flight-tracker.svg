<svg xmlns="http://www.w3.org/2000/svg" width="1058" height="768" viewBox="0 0 1058 768" role="img" aria-labelledby="title desc">
  <title id="title">Flight Guardian website preview</title>
  <desc id="desc">A light blue Flight Guardian hero page with a large Book Flights At The Perfect Moment headline and call to action buttons.</desc>
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="36%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#eaf7ff"/>
      <stop offset="100%" stop-color="#e9f6fd"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0b83cf" flood-opacity="0.18"/>
    </filter>
    <filter id="whiteShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="13" flood-color="#1f3347" flood-opacity="0.10"/>
    </filter>
    <filter id="planeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1058" height="768" fill="url(#heroGlow)"/>

  <rect y="0" width="1058" height="66" fill="#f8fcff" opacity="0.94"/>
  <line x1="0" y1="66" x2="1058" y2="66" stroke="#dcebf5"/>

  <g transform="translate(6 14)">
    <circle cx="16" cy="16" r="16" fill="#0b83cf"/>
    <path d="M23.8 23.2 22 15l3.5-3.5C27 10 27.5 8 27 7c-1-.5-3 0-4.5 1.5L19 12 10.8 10.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L15 16l-2 3h-3l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2Z" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" transform="translate(-5 -5)"/>
  </g>
  <text x="46" y="38" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="800">Flight Guardian</text>

  <text x="656" y="37" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500">Search flights</text>
  <path d="M790 25a8 8 0 1 0 8 8 6 6 0 0 1-8-8Z" fill="none" stroke="#0284c7" stroke-width="1.8"/>
  <text x="835" y="37" fill="#334155" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500">Log in</text>
  <rect x="900" y="14" width="118" height="36" rx="18" fill="#0b83cf"/>
  <text x="922" y="37" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="14" font-weight="800">Get started</text>

  <rect x="405" y="124" width="212" height="34" rx="17" fill="#caecff" stroke="#8ed3ff"/>
  <circle cx="426" cy="141" r="4" fill="#0284c7"/>
  <text x="438" y="145" fill="#0575bd" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" font-weight="900" letter-spacing="2.1">DISCOVER THE BEST DEALS</text>

  <text x="14" y="267" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="96" font-weight="950" letter-spacing="-4">BOOK FLIGHTS AT THE</text>
  <rect x="89" y="338" width="846" height="16" fill="#f8d66d" opacity="0.48"/>
  <text x="91" y="354" fill="#087cc7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="100" font-weight="950" letter-spacing="-4">PERFECT MOMENT</text>

  <g opacity="0.34" filter="url(#planeGlow)" transform="translate(98 359) rotate(-22)">
    <path d="M53 57 44 20 60 4c7-7 10-14 8-18-4-2-11 1-18 8L34 10-3 1c-2-.5-4 .5-5.2 2.4l-1.4 2.3c-1 2.2-.4 4.7 1.6 6.2L16 28 7 42H-8l-5 5 15 10 10 15 5-5V52l14-9 16 24c1.5 2 4 2.6 6.2 1.6l2.3-1.1c1.9-1.4 3-3.5 2.5-5.5Z" fill="none" stroke="#72d5ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="195" y="423" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="26" font-weight="500">
    <tspan>Set your price. We watch 24/7. Get a ping the moment it</tspan>
    <tspan x="352" dy="39">drops. Never overpay again.</tspan>
  </text>

  <g filter="url(#softShadow)">
    <rect x="182" y="521" width="345" height="78" rx="39" fill="#0b83cf"/>
    <text x="230" y="566" fill="#fff" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="950" letter-spacing="2.1">FIND CHEAP FLIGHTS</text>
  </g>
  <g filter="url(#whiteShadow)">
    <rect x="552" y="521" width="288" height="78" rx="39" fill="#fff" opacity="0.94"/>
    <text x="600" y="566" fill="#111827" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="950" letter-spacing="2.1">MY DASHBOARD</text>
  </g>

  <text x="448" y="805" fill="#0284c7" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="1.2">WATCH IT WORK</text>
</svg>
